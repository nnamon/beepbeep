# All BeepBeep tooling runs in containers; nothing is installed on the host.
#
#   docker compose run --rm dev npm install          # deps into the node_modules volume
#   docker compose run --rm dev npm test             # unit tests (incl. decoder accuracy)
#   docker compose run --rm dev npm run build        # static build into dist/
#   docker compose run --rm --service-ports dev npm run dev   # dev server on :7373
#   docker compose run --rm e2e                      # Playwright screenshots + e2e
#   docker compose run --rm voice                    # regenerate public/voice/ clips (Piper TTS)
#
# Deployment is GitHub Pages, built by .github/workflows/pages.yml (also in a container).

name: beepbeep

services:
  dev:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "7373:7373"
    environment:
      - CI=1
    command: ["bash"]

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CI=1
    command: ["npx", "playwright", "test"]

  voice:
    build:
      context: .
      dockerfile: scripts/voice.Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - voice_models:/models
    command: ["python", "scripts/voice_clips.py"]
    profiles: ["tools"]

volumes:
  node_modules:
  voice_models:
